plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xuvenz.portraitforcer'
    compileSdk 35

    buildFeatures {
        // AIDL generation is disabled by default in recent Android Gradle Plugin
        // versions, but the Shizuku user service is exposed through this IPC API.
        aidl true
    }

    defaultConfig {
        applicationId 'com.xuvenz.portraitforcer'
        minSdk 24
        targetSdk 28
        versionCode 4
        versionName '1.2'
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
