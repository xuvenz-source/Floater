name: Release Portrait Forcer APK

on:
  push:
    branches: [ main ]
    paths:
      - 'portrait-forcer/**'
      - '.github/workflows/release-portrait-forcer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p portrait-forcer assembleDebug --stacktrace
      - name: Prepare APK
        run: cp portrait-forcer/app/build/outputs/apk/debug/app-debug.apk Portrait-Forcer-v1.2.apk
      - name: Publish v1.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create portrait-forcer-v1.2 Portrait-Forcer-v1.2.apk \
            --repo ${{ github.repository }} \
            --target main \
            --title "Portrait Forcer v1.2 — Shizuku lab" \
            --notes "Android 10 Shizuku experiment for Skylore. Includes resizable/task-bounds and temporary logical-display modes, diagnostics, saved settings, and prominent restoration controls. Android cannot directly stretch another app's Surface."
