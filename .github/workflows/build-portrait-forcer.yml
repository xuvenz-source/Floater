name: Build Portrait Forcer APK

on:
  push:
    branches: [ force-portrait-app ]
    paths:
      - 'portrait-forcer/**'
      - '.github/workflows/build-portrait-forcer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p portrait-forcer assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Portrait-Forcer-APK
          path: portrait-forcer/app/build/outputs/apk/debug/app-debug.apk
