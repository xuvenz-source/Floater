name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Prepare signing key
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            # Be tolerant of copying the whole NAME=value line, quotes, markdown,
            # or even surrounding text into the GitHub secret. Our PKCS12/JKS
            # payload begins with MII, so extract the actual base64 token.
            export KS_RAW="$ANDROID_KEYSTORE_BASE64"
            KS_B64="$(python3 - <<'PY'
          import os, re
          raw = os.environ.get('KS_RAW', '')
          matches = re.findall(r'MII[A-Za-z0-9+/=]+', raw.replace('\r', '').replace('\n', ''))
          if not matches:
              raise SystemExit('No keystore base64 payload beginning with MII was found in ANDROID_KEYSTORE_BASE64')
          print(max(matches, key=len))
          PY
            )"

            clean_secret() {
              local value="$1"
              local prefix="$2"
              value="${value#$prefix=}"
              value="${value//$'\r'/}"
              value="${value//$'\n'/}"
              value="${value#\"}"
              value="${value%\"}"
              value="${value#\'}"
              value="${value%\'}"
              printf '%s' "$value"
            }

            STORE_PASS="$(clean_secret "$ANDROID_KEYSTORE_PASSWORD" ANDROID_KEYSTORE_PASSWORD)"
            KEY_ALIAS="$(clean_secret "$ANDROID_KEY_ALIAS" ANDROID_KEY_ALIAS)"
            KEY_PASS="$(clean_secret "$ANDROID_KEY_PASSWORD" ANDROID_KEY_PASSWORD)"

            printf '%s' "$KS_B64" | base64 --decode > rapidtap-release.jks

            keytool -list \
              -keystore rapidtap-release.jks \
              -storepass "$STORE_PASS" \
              -alias "$KEY_ALIAS" > /dev/null

            echo "SIGN_STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
            echo "SIGN_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
            echo "SIGN_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=persistent" >> "$GITHUB_ENV"
          else
            TEMP_PASS="rapidtap-local-release"
            keytool -genkeypair -v \
              -keystore rapidtap-release.jks \
              -storepass "$TEMP_PASS" \
              -keypass "$TEMP_PASS" \
              -alias rapidtap \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Rapid Tap Toggle, OU=Personal App, O=Rapid Tap Toggle, L=Melbourne, ST=Victoria, C=AU"
            echo "SIGN_STORE_PASS=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "SIGN_KEY_PASS=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "SIGN_KEY_ALIAS=rapidtap" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=temporary" >> "$GITHUB_ENV"
          fi

      - name: Align release APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/RapidTapToggle-release-aligned.apk

      - name: Sign release APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks rapidtap-release.jks \
            --ks-key-alias "$SIGN_KEY_ALIAS" \
            --ks-pass "pass:$SIGN_STORE_PASS" \
            --key-pass "pass:$SIGN_KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out app/build/outputs/apk/release/RapidTapToggle-release.apk \
            app/build/outputs/apk/release/RapidTapToggle-release-aligned.apk

      - name: Verify APK signature
        run: |
          echo "Signing mode: $SIGNING_MODE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/RapidTapToggle-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RapidTapToggle-Release-APK
          path: app/build/outputs/apk/release/RapidTapToggle-release.apk
          if-no-files-found: error
