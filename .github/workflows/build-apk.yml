name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Create signing key
        run: |
          keytool -genkeypair -v \
            -keystore rapidtap-release.jks \
            -storepass rapidtap-local-release \
            -keypass rapidtap-local-release \
            -alias rapidtap \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Rapid Tap Toggle, OU=Personal App, O=Rapid Tap Toggle, L=Melbourne, ST=Victoria, C=AU"

      - name: Align release APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/RapidTapToggle-release-aligned.apk

      - name: Sign release APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks rapidtap-release.jks \
            --ks-key-alias rapidtap \
            --ks-pass pass:rapidtap-local-release \
            --key-pass pass:rapidtap-local-release \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out app/build/outputs/apk/release/RapidTapToggle-release.apk \
            app/build/outputs/apk/release/RapidTapToggle-release-aligned.apk

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/RapidTapToggle-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RapidTapToggle-Release-APK
          path: app/build/outputs/apk/release/RapidTapToggle-release.apk
          if-no-files-found: error
